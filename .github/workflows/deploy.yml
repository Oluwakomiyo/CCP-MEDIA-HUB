name: Build and Deploy AEC Application

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:

  # ============================================================
  # 1. BUILD & PUSH DOCKER IMAGES
  # ============================================================

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_owner: ${{ steps.meta.outputs.image_owner }}

    steps:

      # --------------------------------------------------------
      # Checkout source code
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Generate image tag and lowercase image owner
      #
      # Example:
      # image_tag   = a6f5b25
      # image_owner = oluwakomiyo
      # --------------------------------------------------------

      - name: Generate image metadata
        id: meta
        shell: bash
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"
          IMAGE_OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"

          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_owner=${IMAGE_OWNER}" >> "$GITHUB_OUTPUT"

          echo "Image tag: ${IMAGE_TAG}"
          echo "Image owner: ${IMAGE_OWNER}"

      # --------------------------------------------------------
      # Setup Docker Buildx
      # --------------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --------------------------------------------------------
      # Login to GitHub Container Registry
      # --------------------------------------------------------

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------------
      # Build and push BACKEND
      # --------------------------------------------------------

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true

          tags: |
            ghcr.io/${{ steps.meta.outputs.image_owner }}/aec-backend:${{ steps.meta.outputs.image_tag }}
            ghcr.io/${{ steps.meta.outputs.image_owner }}/aec-backend:latest

          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --------------------------------------------------------
      # Build and push FRONTEND
      # --------------------------------------------------------

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true

          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}

          tags: |
            ghcr.io/${{ steps.meta.outputs.image_owner }}/aec-frontend:${{ steps.meta.outputs.image_tag }}
            ghcr.io/${{ steps.meta.outputs.image_owner }}/aec-frontend:latest

          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ============================================================
  # 2. DEPLOY TO LINUX VM
  # ============================================================

  deploy:
    name: Deploy to Linux VM
    runs-on: 
      - self-hosted 
      - linux 
      - x64

    needs:
      - build-and-push

    steps:

      # --------------------------------------------------------
      # Update /opt/aec with latest source code
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: aec-source

      - name: Update /opt/aec
        shell: bash
        run: |
          set -e

          sudo rsync -a \
            --delete \
            --exclude='.env' \
            --exclude='.deployment.env' \
            --exclude='backend/database.db' \
            --exclude='backend/uploads/' \
            aec-source/ /opt/aec/

      # --------------------------------------------------------
      # SSH into Linux VM and deploy
      # --------------------------------------------------------

      - name: Deploy application 
        shell: bash 
        run: | 

          set -e 
          
          echo "==========================================" 
          echo "Starting AEC deployment" 
          echo "=========================================="

            # ==================================================
            # Application directory
            # ==================================================

            cd /opt/aec

            # ==================================================
            # Login to GitHub Container Registry
            # ==================================================

            echo "${{ secrets.GHCR_TOKEN }}" | \
              docker login ghcr.io \
              -u "${{ secrets.GHCR_USERNAME }}" \
              --password-stdin

            # ==================================================
            # Export deployment variables
            # ==================================================

            export IMAGE_TAG="${{ needs.build-and-push.outputs.image_tag }}"
            export IMAGE_OWNER="${{ needs.build-and-push.outputs.image_owner }}"

            export BACKEND_IMAGE="ghcr.io/${IMAGE_OWNER}/aec-backend"
            export FRONTEND_IMAGE="ghcr.io/${IMAGE_OWNER}/aec-frontend"

            echo "Deploying image tag: ${IMAGE_TAG}"
            echo "Image owner: ${IMAGE_OWNER}"
            echo "Backend image: ${BACKEND_IMAGE}"
            echo "Frontend image: ${FRONTEND_IMAGE}"

            # ==================================================
            # Pull the EXACT images created by this deployment
            # ==================================================

            echo "Pulling backend image..."

            docker pull "${BACKEND_IMAGE}:${IMAGE_TAG}"

            echo "Pulling frontend image..."

            docker pull "${FRONTEND_IMAGE}:${IMAGE_TAG}"

            # ==================================================
            # Create deployment environment file
            #
            # docker-compose.yml will use these variables.
            # ==================================================

            cat > .deployment.env <<EOF
            BACKEND_IMAGE=${BACKEND_IMAGE}
            FRONTEND_IMAGE=${FRONTEND_IMAGE}
            IMAGE_TAG=${IMAGE_TAG}
            EOF

            # ==================================================
            # Deploy
            # ==================================================

            echo "Starting Docker Compose..."

            docker compose \
              --env-file .deployment.env \
              up -d \
              --remove-orphans

            # ==================================================
            # Wait for containers to start
            # ==================================================

            echo "Waiting for containers to start..."
            
            sleep 15

            # ==================================================
            # Show container status
            # ==================================================

            echo "Container status:"

            docker compose ps

            # ==================================================
            # Check backend health
            # ==================================================

            echo "Checking backend health..."

            if ! docker inspect \
              --format='{{.State.Health.Status}}' \
              aec-backend | grep -q "healthy"; then

              echo "Backend health check failed!"

              docker compose logs --tail=100 backend

              exit 1
            fi

            echo "Backend is healthy."

            # ==================================================
            # Check frontend is running
            # ==================================================

            echo "Checking frontend status..."

            if ! docker inspect \
              --format='{{.State.Status}}' \
              aec-frontend | grep -q "running"; then

              echo "Frontend is not running!"

              docker compose logs --tail=100 frontend

              exit 1
            fi

            echo "Frontend is running."

            # ==================================================
            # Cleanup old unused Docker images
            # ==================================================

            echo "Cleaning up unused Docker images..."
            
            docker image prune -af

            # ==================================================
            # Deployment successful
            # ==================================================

            echo "=========================================="
            echo "AEC deployment successful"
            echo "Image tag: ${IMAGE_TAG}"
            echo "=========================================="