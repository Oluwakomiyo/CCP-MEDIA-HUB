version: '3.8'

services:
  backend:
    image: ${BACKEND_IMAGE}:${IMAGE_TAG}
    container_name: aec-backend
    expose:
      - "5000"
    env_file:
      - .env 
    volumes:
      # PERSISTENCE: Save database and images on the host machine
      - ./backend/database.db:/app/database.db
      - ./backend/uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
       test: ["CMD", "wget", "--spider", "http://localhost:5000/health"]
       interval: 30s
       timeout: 10s
       retries: 3

  frontend:
    image: ${FRONTEND_IMAGE}:${IMAGE_TAG}
    container_name: aec-frontend
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: aec-cloudflared
    restart: unless-stopped
    command: tunnel run
    env_file:
      - .env
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}   

networks:
  default:
    name: aec-network  